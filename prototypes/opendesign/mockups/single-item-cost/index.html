 const buy=()=>setModal(true),confirmBuy=()=>{setUnlocked(true);localStorage.setItem('costPaid','yes');setModal(false)};
 return <div className="shell"><header className="top"><div className="brand"><div className="brand-mark">生</div><span>生意线 · 能力工作台</span></div><div className="crumb">能力库　/　S2 成本与定价　/　单品成本核算</div><button className="top-link" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}>回到顶部 ↑</button></header><main className="main">
 <section className="left"><div className="eyebrow">S2 · 成本与定价 / 单品核算</div><h1 className="title">卖出去的每一份，<br/><em>到底留下多少钱？</em></h1><p className="lead">不让你先学会成本公式。说说你做的是什么、剩下多少、想算什么，我们把数字变成一张看得懂的经营确认卡。</p><div className="proofs"><span className="proof"><b>不懂损耗率也能用</b> 系统自动算</span><span className="proof"><b>先免费试算</b> 确认后再选版本</span><span className="proof"><b>只用自己的数字</b> 不编市场报价</span></div><div className="gallery"><div className="thumbs">{cases.map(c=><button key={c.id} className={'thumb '+(current.id===c.id?'active':'')} onClick={()=>chooseCase(c.id)}>{c.name}<br/>典型案例</button>)}</div><div className={'photo '+current.id}><div className={'cup '+current.id}></div><span className="photo-caption">场景示意 · 案例数据可点选体验</span></div></div><div className="case-head"><h2>{current.title}</h2><small>案例仅用于演示，非市场报价</small></div><div className="case-summary"><p>{current.desc}</p><div className="quote">“{current.quote}”</div><div className="tiles"><div className="tile"><small>这一批花了</small><strong>¥{calc.batch.toFixed(0)}</strong></div><div className="tile"><small>最后卖出</small><strong>{calc.saleable} {current.unit}</strong></div><div className="tile"><small>自动算损耗</small><strong>{calc.waste.toFixed(1)}%</strong></div></div><div className="story"><h3>不是看一个百分比，而是看钱去哪了</h3><p>选出你最常遇到的损耗原因，再告诉我们这次最想知道什么。结果卡会把成本、毛利和可改善空间放在一起讲清楚。</p><div className="story-points"><div className="story-point"><b>先讲清情况</b><span>场景、损耗原因和目标</span></div><div className="story-point"><b>自动拆出数字</b><span>单份成本、毛利和损耗</span></div><div className="story-point"><b>给出下一步</b><span>价格或出品量怎么调整</span></div></div></div></div></section>
 <aside className="right"><div className="step-head"><h2>先确认你的经营情况</h2><span className="step-count">第 {step} / 3 步</span></div><div className="progress"><i style={{width:(step/3*100)+'%'}}></i></div>{step===1&&<><div className="confirm-card"><h3>① 你平时主要做哪类生意？</h3><p>先选最像你的，案例和示范数据会跟着切换。</p><div className="choice-grid">{cases.map(c=><button key={c.id} className={'choice '+(current.id===c.id?'active':'')} onClick={()=>chooseCase(c.id)}>{c.name}<small>{c.kind} · 典型案例</small></button>)}</div></div><div className="confirm-card"><h3>② 这次没卖掉 / 做坏的主要原因？</h3><p>选最常见的一种；这一步帮助解释损耗。</p><div className="loss-reasons">{reasonOptions.map(x=><button key={x} className={'reason '+(reason===x?'active':'')} onClick={()=>{setReason(x);localStorage.setItem('costReason',x)}}>{x}</button>)}</div></div><div className="confirm-card"><h3>③ 你最想先弄明白什么？</h3><div className="choice-grid">{['知道一份实际能赚多少','每天至少要卖多少份','看看浪费主要花掉多少钱'].map(x=><button key={x} className={'choice '+(goal===x?'active':'')} onClick={()=>{setGoal(x);localStorage.setItem('costGoal',x)}}>{x}</button>)}</div></div><div className="cta-row"><button className="cta" onClick={next}>下一步：填这批真实数字 →</button><button className="cta secondary" onClick={reset}>恢复案例</button></div></>}{step===2&&<><div className="confirm-card"><h3>确认卡 · {current.name}本次核算</h3><p>填你知道的数字。不确定的先用案例数据，结果随输入自动更新。</p><div className="field-grid"><div className="field"><label>这批一共花了（元）</label><input type="number" min="0" value={inputs.batch} onChange={e=>update('batch',e.target.value)}/></div><div className="field"><label>预计能做多少份</label><input type="number" min="1" value={inputs.expected} onChange={e=>update('expected',e.target.value)}/></div><div className="field"><label>最后实际卖掉多少份</label><input type="number" min="1" max={inputs.expected} value={inputs.saleable} onChange={e=>update('saleable',e.target.value)}/><small>把做坏、试吃、剩下没卖的份数扣掉</small></div><div className="field"><label>准备卖多少钱 / 份</label><div className="price-buttons"><button onClick={()=>update('price',Math.max(0,(Number(inputs.price)||0)-1).toFixed(1))}>−</button><input type="number" min="0" step=".5" value={inputs.price} onChange={e=>update('price',e.target.value)}/><button onClick={()=>update('price',((Number(inputs.price)||0)+1).toFixed(1))}>＋</button></div></div><div className="field"><label>每月固定成本（可选）</label><input type="number" min="0" value={inputs.fixed} onChange={e=>update('fixed',e.target.value)}/><small>房租、水电；不清楚可以暂用 ¥3000</small></div></div><div className="auto-chip"><span>确认卡已自动识别损耗 · 原因：{reason}</span><strong>{calc.waste.toFixed(1)}%</strong></div></div><div className="cta-row"><button className="cta secondary" onClick={()=>setStep(1)}>← 修改确认信息</button><button className="cta" onClick={next} disabled={!calc.valid}>生成我的经营结果卡 →</button></div>{!calc.valid&&<p style={{color:'var(--red)',fontSize:10}}>请确认：预计份数大于 0，实际卖出份数须在 1 到预计份数之间，售价也要大于 0。</p>}</>}{step===3&&confirmed&&<><div className={'result-card '+calc.level}><span className="result-label">{current.name} · {goal}</span><h3>{calc.valid?(calc.gross>=0?'卖 10份，大约留下':'卖 10份，大约还差'):'请检查可售份数'} {calc.valid&&<em>¥{Math.abs(calc.tenGross).toFixed(0)}</em>}</h3><p>{calc.valid?('单份成本 ¥'+calc.unitCost.toFixed(2)+'；单份毛利 '+(calc.gross>=0?'¥':'')+calc.gross.toFixed(2)+'。注意：这是毛利，还没扣房租、水电和平台费。'):'可售份数必须大于 0，且不能超过预计产量。'}</p><div className="result-bar"><i style={{width:Math.max(0,Math.min(100,calc.margin))+'%'}}></i></div><div className="result-foot"><span>毛利率 {calc.margin.toFixed(1)}%</span><b>{calc.status}</b></div></div><div className="insight"><small>你的经营机会 · 根据本次填写估算</small><strong>{calc.valid?'如果少浪费 '+Math.max(1,Math.round(calc.expected*.05))+' 份，每批可多留下约 ¥'+(Math.max(1,Math.round(calc.expected*.05))*calc.unitCost).toFixed(0):'先补齐可售份数，才能估算改善空间'}</strong><span>{calc.valid?'目前系统识别损耗 '+calc.waste.toFixed(1)+'%，主要原因：'+reason+'。建议先从这一个环节开始记录。':'结果会在数据有效后生成，不会用虚构数字替你判断。'}</span></div><div className="mini-total"><small>{calc.breakeven===null?'当前售价低于单份成本，暂时无法保本':'覆盖 ¥'+calc.fixed+' 固定成本的日均保本量'}</small><strong>{calc.breakeven===null?'先调整售价':calc.breakeven+' '+current.unit+' / 天'}</strong></div><div className="cta-row"><button className="cta secondary" onClick={()=>setStep(2)}>← 修改数字</button><button className="cta secondary" onClick={reset}>重新确认</button></div></>}{step<3&&<div className="mini-total"><small>先免费预览结果 · 当前案例已填入示范数据</small><strong>输入你的数字，免费生成结果卡</strong><span>购买前可先看到毛利、损耗和建议；解锁后可保存、复算和处理更多商品。</span></div>}<h2 className="pay-title">选择你需要的版本</h2><p className="pay-sub">一次购买 · 先看免费结果，再解锁完整能力</p><div className="plan-list">{planList.map(p=><button key={p.id} className={'plan '+(selected.id===p.id?'active':'')} onClick={()=>{setPlanId(p.id);localStorage.setItem('costPlan',p.id)}}>{p.tag&&<span className="tag">{p.tag}</span>}<span className="plan-name">{p.name}</span><span className="plan-desc">{p.desc}</span><span className="plan-price">¥{p.price}<small> / 次</small></span></button>)}</div><div className="price-foot"><span>本次解锁 · {selected.name}</span><strong>¥{selected.price}</strong></div><button className="buy" onClick={buy}>{unlocked?'已解锁 · 进入我的核算':'解锁完整结果卡 · '+selected.price+'元'}</button><div className="footnote">原型演示，不会真实扣款；正式支付接入后再上线价格</div><div className="unlock-list"><strong>解锁后你能带走什么</strong><ul><li>保存本次确认卡和每次核算结果</li><li>查看损耗、单份成本、毛利和保本量的来源</li><li>按你选的经营目标获得对应的下一步建议</li></ul></div></aside></main>{modal&&<div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(false)}><div className="modal"><h2>确认解锁「{selected.name}」？</h2><p>这是购买流程原型，确认后只在本机记为已解锁，不会真实扣款。</p><div className="order"><div><span>购买内容</span><b>单品成本核算 · {selected.name}</b></div><div><span>金额</span><b>¥{selected.price}</b></div></div><div className="modal-actions"><button className="cancel" onClick={()=>setModal(false)}>再看看</button><button className="confirm" onClick={confirmBuy}>确认解锁</button></div></div></div>}{unlocked&&<div className="toast">已解锁：完整结果卡已加入本机演示</div>}</div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
// 经营机会卡：用按钮模拟“少浪费几份”，让结果不止停留在一个百分比。
const mountOpportunity=()=>{
 const result=document.querySelector('.result-card'); if(!result||document.querySelector('.scenario')) return;
 const box=document.createElement('div'); box.className='scenario'; box.innerHTML='<div class="scenario-head"><div><b>把损耗变成钱</b><small>点一下，看看少浪费几份能多留下多少</small></div><div class="scenario-value">0 <small>份</small></div></div><div class="scenario-actions" style="display:flex;gap:6px;margin-top:12px"><button class="reason" data-n="1">少浪费 1 份</button><button class="reason" data-n="2">少浪费 2 份</button><button class="reason" data-n="all">全部避免</button></div><div class="scenario-result"><span>每批可多留下</span><strong>¥0</strong></div><p class="scenario-note">这是改善空间演示，不会修改你的原始确认数据。</p></div>';
 result.insertAdjacentElement('afterend',box);
 const render=(n)=>{const ns=[...document.querySelectorAll('input[type="number"]')].map(x=>Number(x.value)||0),expected=ns[1]||Number(localStorage.getItem('costExpected'))||0,saleable=ns[2]||Number(localStorage.getItem('costSaleable'))||0,price=ns[3]||Number(localStorage.getItem('costPrice'))||0,max=Math.max(0,expected-saleable); const units=n==='all'?max:Math.min(Number(n)||0,max); box.querySelector('.scenario-value').innerHTML=units+' <small>份</small>'; box.querySelector('.scenario-result strong').textContent='¥'+(units*price).toFixed(0)};
 box.querySelectorAll('[data-n]').forEach(btn=>btn.addEventListener('click',()=>{box.querySelectorAll('[data-n]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render(btn.dataset.n)}));
};
new MutationObserver(mountOpportunity).observe(document.getElementById('root'),{subtree:true,childList:true});
// 确认卡由原型层补入：勾选后才能生成结果，避免用户跳过核对直接付款。
const mountCheckCard=()=>{
 const chip=document.querySelector('.auto-chip'); if(!chip||document.querySelector('.case-confirm')) return;
 const card=document.createElement('div'); card.className='case-confirm'; card.innerHTML='<div class="case-confirm-head"><b>请核对本次确认卡</b><span>点确认后再生成结果</span></div><div class="confirm-summary"><div><small>已选场景</small><strong>本次经营案例</strong></div><div><small>损耗已自动算</small><strong>请查看上方百分比</strong></div><div><small>依据</small><strong>你刚填写的数字</strong></div><div><small>结果性质</small><strong>经营参考</strong></div></div><label class="confirm-check"><input type="checkbox"/><span>我确认以上数字是本次估算依据；结果是经营参考，不代表最终净利润。</span></label>';
 chip.insertAdjacentElement('afterend',card);
 const btn=[...document.querySelectorAll('.cta')].find(x=>x.textContent.includes('生成我的经营结果卡'));
 const check=card.querySelector('input'); if(btn){btn.disabled=true;check.addEventListener('change',()=>{btn.disabled=!check.checked}); new MutationObserver(()=>{const current=[...document.querySelectorAll('.cta')].find(x=>x.textContent.includes('生成我的经营结果卡')); if(current&&!check.checked) current.disabled=true}).observe(document.querySelector('.right'),{subtree:true,attributes:true,attributeFilter:['disabled']})}
};
new MutationObserver(mountCheckCard).observe(document.getElementById('root'),{subtree:true,childList:true});
</script></body></html>
