top:1px solid #eef1f6}.candidate-foot small{font-size:10px;color:var(--muted)}.choose{border:1px solid #c8d4fd;background:#fff;color:var(--blue);border-radius:7px;padding:6px 9px;font-size:11px}.candidate.selected .choose{background:var(--blue);color:#fff;border-color:var(--blue)}.detail{min-width:0}.detail-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 17px}.tab{border:0;background:transparent;color:var(--muted);padding:8px 10px;font-size:12px;border-bottom:2px solid transparent}.tab:hover,.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.detail-title{display:flex;gap:12px;align-items:flex-start;margin-bottom:17px}.detail-title .candidate-icon{width:40px;height:40px}.detail-title h2{font-size:19px;margin:0 0 3px}.detail-title p{margin:0;color:var(--muted);font-size:12px}.check{margin-left:auto;color:#187e6b;background:var(--mint-soft);font-size:10px;border-radius:999px;padding:5px 8px}.adapt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.adapt-stat{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcff}.adapt-stat small{display:block;color:var(--muted);font-size:10px}.adapt-stat strong{display:block;font-size:16px;margin-top:4px}.adapt-stat strong.good{color:#187e6b}.section-label{display:flex;justify-content:space-between;align-items:center;margin:0 0 9px}.section-label strong{font-size:12px}.section-label small{color:var(--muted);font-size:10px}.flow{display:flex;gap:0;margin-bottom:17px}.flow-item{flex:1;position:relative;text-align:center}.flow-item:after{content:'';height:1px;position:absolute;top:11px;left:50%;right:-50%;background:#dbe2f0}.flow-item:last-child:after{display:none}.flow-dot{width:23px;height:23px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:#eef2f9;color:#8190a8;font-size:10px;position:relative;z-index:1;border:3px solid #fff}.flow-item.done .flow-dot{background:var(--mint);color:#fff}.flow-item.active .flow-dot{background:var(--blue);color:#fff;box-shadow:0 0 0 4px #e6ecff}.flow-item span{font-size:10px;color:var(--muted)}.flow-item.active span,.flow-item.done span{color:var(--ink);font-weight:600}.card-preview{border:1px solid #dbe2f1;border-radius:12px;padding:15px;background:#fbfcff}.card-preview-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px}.card-preview-head h3{font-size:14px;margin:0}.card-preview-head small{font-size:10px;color:var(--muted)}.required{font-size:10px;color:#a66c1b;background:var(--gold-soft);padding:4px 7px;border-radius:999px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#66738a}.field input,.field select{border:1px solid #d5dbea;border-radius:8px;padding:9px 10px;background:#fff;outline:none;font-size:12px}.field input:focus,.field select:focus{border-color:#98aaf1;box-shadow:0 0 0 3px #eaf0ff}.hint{font-size:10px;color:#8b7446;background:#fff7e9;border:1px solid #f0d8a8;border-radius:8px;padding:9px 10px;margin-top:11px}.preview-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.primary{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:9px 13px;box-shadow:0 5px 12px rgba(53,93,232,.18)}.primary:disabled{background:#bfc9e9;box-shadow:none;cursor:not-allowed}.outline{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 12px}.generated{margin-top:14px;border:1px solid #a9ddcf;background:#f2fcf8;border-radius:11px;padding:13px}.generated strong{display:block;color:#187e6b;font-size:12px;margin-bottom:7px}.generated p{font-size:11px;color:#3b665c;margin:0 0 10px}.generated-actions{display:flex;gap:8px}.generated-actions button{font-size:11px}.empty-detail{padding:34px;text-align:center;color:var(--muted);border:1px dashed #cfd6e3;border-radius:12px}.toast{position:fixed;right:26px;bottom:25px;background:#172238;color:#fff;border-radius:9px;padding:10px 13px;font-size:12px;box-shadow:0 12px 25px rgba(20,35,68,.22);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(18,30,52,.35);display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(510px,100%);background:#fff;border-radius:15px;padding:21px;box-shadow:0 24px 70px rgba(20,35,68,.22)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start}.modal h2{font-size:18px;margin:0 0 4px}.modal p{color:var(--muted);font-size:12px;margin:0 0 15px}.close{border:0;background:#f1f3f8;border-radius:50%;width:28px;height:28px}.rule-list{display:grid;gap:9px}.rule{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:9px}.rule input{margin-top:3px;accent-color:var(--blue)}.rule strong{display:block;font-size:12px}.rule small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}

<body>
  <div id="root"></div>
  <script type="text/babel">
    const {useEffect, useMemo, useState} = React;
    const candidates = [
      {id:'single-cost', icon:'¥', title:'单品成本核算', desc:'把原料、包装、损耗和人工拆成一张可复核的单品成本表。', score:94, tags:['首期优先','确认卡轻量','可计算'], meta:'市场参考：Excel表格 · excel-xlsx（ClawHub）', card:'单品成本', fields:['商品 / 服务名称','原料成本','包装成本','损耗率'], note:'产品落地：S2 单品成本；来源只借鉴公式输入思路，不复制原文。'},
      {id:'break-even', icon:'↗', title:'定价与保本测算', desc:'比较售价、毛利和保本销量，给出能解释清楚的价格风险。', score:91, tags:['首期优先','可计算','接续能力'], meta:'市场参考：数据分析 · analyze（Anthropic knowledge-work-plugins）', card:'定价保本', fields:['商品 / 服务名称','单份成本','拟定售价','固定成本'], note:'产品落地：S2 定价保本；依赖单品成本结果后继续进入。'},
      {id:'bundle', icon:'▦', title:'套餐测算', desc:'把多个商品组合成套餐，核对套餐成本、让利幅度和最低销量。', score:87, tags:['可组合','可计算','需商品清单'], meta:'市场参考：数据分析 · analyze（Anthropic knowledge-work-plugins）', card:'套餐测算', fields:['套餐名称','商品组成','套餐售价','预计销量'], note:'产品落地：S2 套餐测算；市场库没有“套餐测算”同名 Skill。'},
      {id:'supplier', icon:'⌖', title:'供应商比价分析', desc:'把不同供应商的报价、起订量、配送和损耗风险放在同一张比较表。', score:85, tags:['可组合','材料依赖','采购前'], meta:'市场参考：数据分析 · analyze（Anthropic knowledge-work-plugins）', card:'供应商比价', fields:['采购品','供应商报价','起订量','配送条件'], note:'产品落地：S4 供应商比价；用确认卡收集真实报价，不自动补写。'},
      {id:'review', icon:'↺', title:'经营复盘与复购', desc:'用营业额、销量、成本和顾客反馈，决定下一步保留、调整或暂停。', score:82, tags:['可组合','数据积累','经营后'], meta:'市场参考：产品指标复盘 · metrics-review（Anthropic knowledge-work-plugins）', card:'经营复盘', fields:['经营日期','销量','营业额','顾客反馈'], note:'产品落地：S6 经营复盘；需要先有真实经营记录。'}
    ];
    const defaultForm = {item:'柠檬茶', cost:'4.8', price:'12', volume:'40'};

    function App(){
      const [selectedId,setSelectedId] = useState(localStorage.getItem('selectedSkill') || 'single-cost');
      const [filter,setFilter] = useState('全部');
      const [query,setQuery] = useState('');
      const [tab,setTab] = useState('adapt');
      const [form,setForm] = useState(defaultForm);
      const [generated,setGenerated] = useState(false);
      const [joined,setJoined] = useState(false);
      const [showRules,setShowRules] = useState(false);
      const [toast,setToast] = useState('');
      const selected = candidates.find(x=>x.id===selectedId) || candidates[0];
      const filtered = useMemo(()=>candidates.filter(c=>{
        const matchesFilter = filter==='全部' || (filter==='首期优先' && c.tags.includes('首期优先')) || (filter==='可组合' && c.tags.includes('可组合')) || (filter==='可计算' && c.tags.includes('可计算'));
        const needle = query.trim().toLowerCase();
        return matchesFilter && (!needle || `${c.title} ${c.desc} ${c.meta}`.toLowerCase().includes(needle));
      }), [filter,query]);
      const notify = (msg)=>{setToast(msg);window.clearTimeout(window.__toast);window.__toast=window.setTimeout(()=>setToast(''),2200)};
      useEffect(()=>{localStorage.setItem('selectedSkill',selectedId);setGenerated(false);setJoined(false)},[selectedId]);
      const setField=(key,val)=>setForm(v=>({...v,[key]:val}));
      const valid = selected.id==='single-cost' ? form.item.trim() && Number(form.cost)>0 : selected.id==='break-even' ? form.item.trim() && Number(form.cost)>0 && Number(form.price)>0 : Boolean((form.f0||'').trim() && (form.f1||'').trim());
      const generate=()=>{if(!valid){notify('请先补齐确认卡必填信息');return}setGenerated(true);notify('已生成一张可继续的确认卡')};
      const join=()=>{setJoined(true);notify('已加入生意线路线：'+selected.card)};
      return <div className="app">
        <aside className="sidebar">
          <div className="brand"><div className="brand-mark">硅</div><div><strong>硅菩提 · 生意线</strong><small>确认卡工作台</small></div></div>
          <div className="nav-label">工作台</div><div className="nav">
            <button><span className="nav-icon">⌂</span><span>我的路线</span></button>
            <button className="active"><span className="nav-icon">◇</span><span>市场技能库</span></button>
            <button><span className="nav-icon">▣</span><span>确认卡</span></button>
            <button><span className="nav-icon">↗</span><span>经营记录</span></button>
          </div>
          <div className="nav-label">资料</div><div className="nav"><button><span className="nav-icon">□</span><span>办事与材料</span></button><button><span className="nav-icon">?</span><span>使用说明</span></button></div>
          <div className="spacer"/><div className="profile"><div className="avatar">SY</div><div><strong>生意线产品组</strong><small>内部预览</small></div></div>
        </aside>
        <main className="main">
          <div className="topbar"><div className="crumb">工作台 / 市场技能库 / 生意线适配</div><div className="top-actions"><div className="search-wrap"><input className="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索技能或场景" /></div><button className="bell" onClick={()=>notify('目前没有新的经营提醒')}>♧</button></div></div>
          <div className="page-title"><div><h1>市场技能库</h1><p>先筛选能复用的能力，再用一张确认卡验证它是否适合你的经营路线。</p></div><span className="status">当前线路：生意线</span></div>
          <section className="hero"><div><h2>先找可复用能力，再编排成自己的工作流</h2><p>“成本与定价”是产品模块名，不一定对应市场库里的同名 Skill。本页把它拆成单品成本、定价保本、套餐测算，并标出哪些能力可以接到同一条确认卡路线。</p></div><div className="hero-note"><small>本轮筛选口径</small><strong>5 个子能力 · 1 条定价工作流</strong></div></section>
          <div className="filters">{['全部','首期优先','可组合','可计算'].map(x=><button key={x} className={'filter '+(filter===x?'active':'')} onClick={()=>setFilter(x)}>{x}</button>)}<button className="filter-rule" onClick={()=>setShowRules(true)}>查看筛选规则 →</button></div>
          <div className="workspace">
            <section className="panel"><div className="panel-head"><div><h2>候选技能</h2><small>按生意线首期范围排序</small></div><span className="count">{filtered.length} 个</span></div><div className="candidate-list">{filtered.map(c=><article key={c.id} className={'candidate '+(selected.id===c.id?'selected':'')}><div className="candidate-top"><div className="candidate-icon">{c.icon}</div><div><h3>{c.title}</h3><p>{c.desc}</p></div><span className="score">匹配 {c.score}</span></div><div className="tags">{c.tags.map(t=><span key={t} className={'tag '+(t==='首期优先'?'good':t==='材料依赖'?'warn':'')}>{t}</span>)}</div><div className="candidate-foot"><small>{c.meta}</small><button className="choose" onClick={()=>{setSelectedId(c.id);setTab('adapt');notify('已切换到 '+c.title)}}>{selected.id===c.id?'已选中':'查看适配'}</button></div></article>)}</div></section>
            <section className="panel detail"><div className="detail-tabs"><button className={'tab '+(tab==='adapt'?'active':'')} onClick={()=>setTab('adapt')}>确认卡适配</button><button className={'tab '+(tab==='method'?'active':'')} onClick={()=>setTab('method')}>方法来源</button><button className={'tab '+(tab==='boundary'?'active':'')} onClick={()=>setTab('boundary')}>产品边界</button></div>
              {tab==='adapt' && <><div className="detail-title"><div className="candidate-icon">{selected.icon}</div><div><h2>{selected.title}</h2><p>{selected.desc}</p></div><span className="check">可做成独立网页</span></div><div className="adapt-grid"><div className="adapt-stat"><small>确认卡字段</small><strong>{selected.fields.length} 个</strong></div><div className="adapt-stat"><small>材料门槛</small><strong className="good">低</strong></div><div className="adapt-stat"><small>组合位置</small><strong>{selected.id==='single-cost'?'入口':'接续'}</strong></div></div><div className="section-label"><strong>从筛选到上架</strong><small>当前在第 2 步</small></div><div className="flow"><div className="flow-item done"><div className="flow-dot">1</div><span>筛选</span></div><div className="flow-item active"><div className="flow-dot">2</div><span>适配确认卡</span></div><div className="flow-item"><div className="flow-dot">3</div><span>生成网页</span></div><div className="flow-item"><div className="flow-dot">4</div><span>回归上架</span></div></div><div className="card-preview"><div className="card-preview-head"><div><h3>{selected.card} · 意图确认卡</h3><small>只收当前动作真正需要的信息，缺口会明确标记。</small></div><span className="required">必填 {selected.id==='single-cost'?'2':'3'} 项</span></div><div className="form-grid">{selected.id==='single-cost' ? <><div className="field"><label>商品 / 服务名称 *</label><input value={form.item} onChange={e=>setField('item',e.target.value)} placeholder="例如：柠檬茶" /></div><div className="field"><label>原料成本（元） *</label><input value={form.cost} onChange={e=>setField('cost',e.target.value)} inputMode="decimal" placeholder="按单份或单件填写" /></div><div className="field"><label>包装成本（元）</label><input value={form.pack||''} onChange={e=>setField('pack',e.target.value)} inputMode="decimal" placeholder="没有就填 0" /></div><div className="field"><label>损耗率（%）</label><input value={form.waste||'5'} onChange={e=>setField('waste',e.target.value)} inputMode="decimal" /></div></> : selected.id==='break-even' ? <><div className="field"><label>商品 / 服务名称 *</label><input value={form.item} onChange={e=>setField('item',e.target.value)} placeholder="例如：柠檬茶" /></div><div className="field"><label>单份成本（元） *</label><input value={form.cost} onChange={e=>setField('cost',e.target.value)} inputMode="decimal" /></div><div className="field"><label>拟定售价（元） *</label><input value={form.price} onChange={e=>setField('price',e.target.value)} inputMode="decimal" /></div><div className="field"><label>固定成本（元 / 月）</label><input value={form.fixed||'3000'} onChange={e=>setField('fixed',e.target.value)} inputMode="decimal" /></div></> : selected.fields.map((f,i)=><div key={f} className={'field '+(i===selected.fields.length-1?'full':'')}><label>{f}{i<2?' *':''}</label><input value={form['f'+i]||''} onChange={e=>setField('f'+i,e.target.value)} placeholder={i<2?'请填写真实信息':'可选，之后补充也可以'} /></div>)}</div><div className="hint">材料闸门：未提供的数据不会被补写成事实；确认卡会把“用户已提供 / AI 假设 / 还需补充”分开。</div><div className="preview-actions"><button className="outline" onClick={()=>{setForm(defaultForm);setGenerated(false);notify('已恢复示例输入')}}>恢复示例</button><button className="primary" onClick={generate}>生成确认卡</button></div>{generated && <div className="generated"><strong>已生成 · {selected.card}确认卡</strong><p>{selected.id==='single-cost' ? `${form.item || '这项商品'}：原料 ¥${form.cost || '—'}，包装 ¥${form.pack || '0'}，损耗率 ${form.waste || '—'}%，系统会继续生成含损耗成本。` : selected.id==='break-even' ? `${form.item || '这项商品'}：成本 ¥${form.cost || '—'}，售价 ¥${form.price || '—'}，下一步计算毛利与保本销量。` : `已收集 ${selected.fields.filter((_,i)=>form['f'+i]).length} 项信息，缺口会在下一步继续询问。`}</p><div className="generated-actions"><button className="primary" onClick={join}>{joined?'已加入路线':'确认并加入路线'}</button>{selected.id==='single-cost' ? <button className="outline" onClick={()=>window.location.href='/opendesign/mockups/single-item-cost/index.html'}>预览独立网页</button> : <button className="outline" onClick={()=>notify('已记录：'+selected.title+'待生成独立网页')}>记录待生成网页</button>}</div></div>}</div></>}
              {tab==='method' && <div className="empty-detail"><h3>方法只作为参考层</h3><p>{selected.meta}。保留“事实 / 假设 / 公式 / 校验”的结构；不直接复制无明确商业许可的正文、代码或样例数据。</p><button className="outline" onClick={()=>notify('已记录为方法参考，不进入产品正文')}>记录参考口径</button></div>}
              {tab==='boundary' && <div className="empty-detail"><h3>产品自己负责的部分</h3><p>确认卡字段、材料闸门、行动卡输出、节点状态和回归验收都由生意线产品维护，外部 Skill 不直接决定平台行为。</p><button className="outline" onClick={()=>notify('边界说明已复制到评审备注')}>复制边界说明</button></div>}
            </section>
          </div>
        </main>
        {showRules && <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget&&setShowRules(false)}><div className="modal"><div className="modal-head"><div><h2>生意线筛选规则</h2><p>这几条规则决定一个公开 Skill 是否进入产品适配池。</p></div><button className="close" onClick={()=>setShowRules(false)}>×</button></div><div className="rule-list"><label className="rule"><input type="checkbox" checked readOnly/><span><strong>能拆成一件明确的事</strong><small>用户能在一次确认卡里说清目标、输入和完成标准。</small></span></label><label className="rule"><input type="checkbox" checked readOnly/><span><strong>确认卡字段少而真实</strong><small>首期优先 3—5 个字段，缺材料时可暂停，不强行补全。</small></span></label><label className="rule"><input type="checkbox" checked readOnly/><span><strong>能回到经营路线</strong><small>结果必须导向下一张行动卡，而不是停在一份泛泛建议。</small></span></label><label className="rule"><input type="checkbox" checked readOnly/><span><strong>许可和边界可核验</strong><small>只借鉴方法；商业复用前逐项检查仓库许可证和来源。</small></span></label></div><div className="modal-actions"><button className="primary" onClick={()=>setShowRules(false)}>知道了</button></div></div></div>}
        <div className={'toast '+(toast?'show':'')}>{toast}</div>
      </div>
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
