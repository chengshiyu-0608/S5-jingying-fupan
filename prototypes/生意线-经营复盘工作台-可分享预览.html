   const planRows=Object.entries(plans).map(([id,item])=>`<button class="plan ${id===selectedPlan?'selected ':''}${id==='deep'?'recommended':''}" data-plan-id="${id}"><span class="plan-label">${planLabelMap[id]}</span><b>${item.name}</b><small>${item.desc}</small><strong>${item.price}</strong><span class="plan-features">${planFeatureMap[id].map(feature=>`<span>${svgIcon('check')}${feature}</span>`).join('')}</span><span class="plan-cta">选择${item.name}<span aria-hidden="true">→</span></span></button>`).join('');
   const el=document.createElement('div');
   el.className='pay-backdrop';
   el.innerHTML=`<div class="pay-drawer"><div class="pay-head"><div><span class="pay-kicker">生意线 · 专业服务</span><h2>把一份报告，变成明天能用的经营决策</h2></div><button class="pay-close" aria-label="关闭">${svgIcon('close')}</button></div><div class="pay-pricing-intro"><span class="pay-kicker">本月经营复盘 · 专业报告</span><h2>选择一份真正能帮你做决定的报告</h2><p>先看清楚利润漏点，再决定要多深的分析。套餐越高，交付的证据链与跟踪建议越完整。</p></div><div class="pay-proof"><b>你的诊断草稿已经准备好了</b><span>毛利 ¥${money(data.gross)} · 毛利率 ${data.margin.toFixed(1)}% · 升级后补齐品项归因和明日行动卡</span></div><div class="plan-list">${planRows}</div><div class="pay-total"><div><small class="pay-current-label">当前方案 · 应付金额</small><strong class="pay-current-amount">¥${plan.price}</strong></div><button class="primary pay-buy">立即购买并生成 ${svgIcon('arrowRight')}</button></div><p class="pay-note">原型演示：不会真实扣款。正式版可接微信支付 / 支付宝。</p></div>`;
   document.body.appendChild(el);
   const close=()=>{el.remove();setShowPay(false)};
   el.addEventListener('click',e=>{const choice=e.target.closest('[data-plan-id]');if(choice){const nextId=choice.dataset.planId;const next=plans[nextId];activePlanId=nextId;el.querySelectorAll('[data-plan-id]').forEach(card=>card.classList.toggle('selected',card.dataset.planId===nextId));const amount=el.querySelector('.pay-current-amount');if(amount)amount.textContent=`¥${next.price}`;const label=el.querySelector('.pay-current-label');if(label)label.textContent=`${next.name} · 应付金额`;setSelectedPlan(nextId);return}if(e.target===el||e.target.closest('.pay-close'))close();if(e.target.closest('.pay-buy')){const current=plans[activePlanId];close();notify(`已选择${current.name}，原型已进入收银台`)}});
   return()=>el.remove();
 },[showPay,data.gross,data.margin]);
 const openLogin=(id=caseId)=>{setCaseId(id);setShowLogin(true)};
 const enterCase=()=>{const chosen=caseStudies.find(x=>x.id===caseId)||caseStudies[0];setRows(chosen.rows);setFiles(chosen.files);setStore(chosen.store);setReportConfirmed(false);setReportAck(false);localStorage.setItem('reviewRows',JSON.stringify(chosen.rows));localStorage.setItem('reviewFiles',JSON.stringify(chosen.files));localStorage.setItem('reviewStore',chosen.store);localStorage.removeItem('reviewConfirmed');localStorage.setItem('reviewDemoLoggedIn','yes');setShowLogin(false);notify(`已进入${chosen.industry}案例，请确认分析口径`);setTimeout(()=>document.querySelector('.body')?.scrollIntoView({behavior:'smooth',block:'start'}),120)};
 useEffect(()=>{if(!showLogin)return;const host=document.createElement('div');document.body.appendChild(host);const root=ReactDOM.createRoot(host);root.render(<LoginDialog caseItem={activeCase} onClose={()=>setShowLogin(false)} onComplete={enterCase}/>);return()=>{setTimeout(()=>root.unmount(),0);host.remove()}},[showLogin,caseId]);
 return <div className="page"><header className="top"><div className="brand"><span className="mark">生</span><span>生意线 · 经营复盘</span></div><span className="crumb">能力库 / 经营复盘工作台</span><div className="top-actions"><button className="login-link" onClick={()=>openLogin(caseId)}>登录查看报告</button><button className="toplink" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}><Icon name="arrowUp" size={14}/>回到顶部</button></div></header>
 <section className="hero"><AnimatedBackdrop/><div className="hero-copy"><div className="service-label">本月经营复盘 · 专业诊断服务</div><h1><span className="hero-line">这个月到底赚没赚钱，</span><br/><em className="hero-line">问题出在哪？</em></h1><p>上传你的账本、流水或损耗记录，我们把成千上百笔经营数据整理成一份能看懂、能执行的门店复盘报告。</p><div className="hero-actions"><button className="primary" onClick={()=>openLogin(caseId)}>登录，生成我的报告<Icon name="arrowRight" size={15}/></button><button className="outline" onClick={()=>document.querySelector('.case-showcase')?.scrollIntoView({behavior:'smooth'})}>先看复杂案例</button></div><div className="hero-proof"><span><Icon name="check" size={13}/>支持 Excel、截图与手工台账</span><span><Icon name="check" size={13}/>先确认口径，再生成结论</span><span><Icon name="check" size={13}/>不只算利润，还定位原因</span></div></div><div className="hero-note"><span className="hero-note-kicker">先把问题讲清楚</span><b><span>不是让你</span><span>再算一遍</span></b><p>你只需要提供真实数据；系统负责汇总营业额、成本、毛利、客单价，并找出利润下滑的主要原因。</p><div className="hero-note-rule"><span>流水</span><strong>→</strong><span>原因</span><strong>→</strong><span>动作</span></div></div></section>
 <section className="case-showcase"><div className="case-heading"><div><small>真实经营结构 · 脱敏重构案例</small><h2>先看别人遇到的问题，<br/>再判断这份报告值不值得做</h2></div><p>案例保留真实经营口径与复杂度，门店名和金额已做脱敏重构，不作为客户背书。点击行业即可查看不同的诊断方式。</p></div><div className="case-tabs">{caseStudies.map(item=><button key={item.id} className={caseId===item.id?'active':''} onClick={()=>setCaseId(item.id)}><b>{item.industry}</b><span>{item.period}</span></button>)}</div><div className="case-stage" key={activeCase.id}><div className="case-story"><span className="case-eyebrow">{activeCase.industry} · {activeCase.period}</span><h3>{activeCase.title}</h3><p>{activeCase.summary}</p><div className="case-source">{activeCase.source.map((x,i)=><span key={i}><Icon name="file" size={13}/>{x}</span>)}</div><div className="case-verdict"><small>系统先给出的经营结论</small><b>{activeCase.verdict}</b><button className="primary" onClick={()=>openLogin(activeCase.id)}>登录查看完整诊断<Icon name="arrowRight" size={15}/></button></div></div><div className="case-report"><div className="case-report-head"><b>{activeCase.industry}经营复盘 · 诊断预览</b><span>数据口径已确认</span></div><div className="case-metrics">{activeCase.metrics.map((m,i)=><div className="case-metric" key={i}><small>{m[0]}</small><b>{m[1]}</b><span>{m[2]}</span></div>)}</div><div className="case-grid"><div className="case-chart"><h4>近 8 周经营表现</h4><div className="case-bars">{activeCase.bars.map((h,i)=><i key={i} style={{'--h':h+'%',animationDelay:(i*.045)+'s'}}></i>)}</div><footer><span>第 1 周</span><span>第 8 周</span></footer></div><div className="case-findings"><h4>利润变化的主要原因</h4><ul>{activeCase.findings.map((f,i)=><li key={i}><strong>{i+1}. {f[0]}</strong><span>{f[1]}</span></li>)}</ul></div></div><div className="case-locked"><div><b>完整报告还有：品项贡献、证据链、明日行动卡</b><span>登录后可进入确认卡，并用这份脱敏案例完整体验。</span></div><button className="outline" onClick={()=>openLogin(activeCase.id)}>继续查看</button></div></div></div></section>
 <main className="body"><section className="source-panel"><div className="section-head"><h2>先把真实经营数据交给我</h2><small>{ready?'已生成诊断草稿':'支持 Excel、截图或手工填入'}</small></div><div className="ingest"><p className="ingest-intro">一整个月的流水可以一次上传，不需要逐单录入；系统会按品项、日期和成本口径整理。</p><div className="dropzone"><Icon name="upload" size={24} className="drop-icon"/><strong>拖入账本 / 流水 / 截图</strong><span>支持 .xlsx、.csv、.png、.jpg · 原型只在本机读取</span><div className="drop-actions"><label className="primary">上传文件<input className="hidden" type="file" multiple accept=".xlsx,.xls,.csv,.png,.jpg,.jpeg" onChange={handleFile}/></label><button className="outline" onClick={loadSample}>用一份示例账本试试</button></div></div>{files.length>0&&<div className="source-list">{files.map((f,i)=><div className="source-item" key={i}><span className="source-icon">{f.name.split('.').pop().toUpperCase().slice(0,4)}</span><div><b>{f.name}</b><small>{f.meta}</small></div><button onClick={()=>{const next=files.filter((_,j)=>j!==i);setFiles(next);localStorage.setItem('reviewFiles',JSON.stringify(next))}}>移除</button></div>)}</div>}<div className="manual"><div className="manual-toggle" onClick={()=>setManualOpen(!manualOpen)}><span>{manualOpen?'收起经营台账':'没有文件？建立本月经营台账'}<Icon name={manualOpen?'arrowUp':'arrowRight'} size={14}/></span><small>{manualOpen?'可连续录入多个品项':'包子、油条、豆浆等可以一次填完'}</small></div>{manualOpen&&<form onSubmit={saveManualRows}><p>不用逐笔记流水。按品项汇总填写，一次把本月卖过的商品列全；订单数不填时按销量估算。</p><div className="manual-table"><div className="manual-table-head"><span>品项</span><span>订单数</span><span>销量</span><span>营业额</span><span>成本</span><span>损耗率</span><span></span></div>{manualRows.map(r=><div className="manual-row" key={r.id}><input aria-label="品项名称" placeholder="如：鲜肉包" value={r.name} onChange={e=>updateManual(r.id,'name',e.target.value)}/><input aria-label="订单数" type="number" placeholder="可选" value={r.orders} onChange={e=>updateManual(r.id,'orders',e.target.value)}/><input aria-label="销量" type="number" placeholder="份" value={r.qty} onChange={e=>updateManual(r.id,'qty',e.target.value)}/><input aria-label="营业额" type="number" placeholder="元" value={r.revenue} onChange={e=>updateManual(r.id,'revenue',e.target.value)}/><input aria-label="成本" type="number" placeholder="元" value={r.cost} onChange={e=>updateManual(r.id,'cost',e.target.value)}/><input aria-label="损耗率" type="number" step="0.1" placeholder="%" value={r.waste} onChange={e=>updateManual(r.id,'waste',e.target.value)}/><div className="manual-row-actions"><button type="button" title="复制这一行" onClick={()=>copyManualRow(r.id)}><Icon name="plus" size={14}/></button><button type="button" title="删除这一行" onClick={()=>removeManualRow(r.id)}><Icon name="close" size={14}/></button></div></div>)}</div><div className="manual-summary"><span>已填 {manualRows.filter(r=>r.name.trim()||r.qty||r.revenue||r.cost).length} 个品项</span><span>营业额 ¥{money(manualRows.reduce((s,r)=>s+Number(r.revenue||0),0))}</span><span>成本 ¥{money(manualRows.reduce((s,r)=>s+Number(r.cost||0),0))}</span></div><div className="manual-actions"><button type="button" className="outline" onClick={addManualRow}><Icon name="plus" size={14}/>新增品项</button><button className="primary manual-submit">保存台账并生成诊断草稿<Icon name="arrowRight" size={15}/></button></div></form>}</div></div><div style={{display:'flex',justifyContent:'space-between',marginTop:12,alignItems:'center'}}><span style={{fontSize:10,color:'var(--muted)'}}>数据只用于本次本机演示</span>{ready&&<button className="outline" onClick={reset}>清空重来</button>}</div></section>
 <section className="report-panel"><div className="section-head"><h2>本月经营复盘报告</h2><small>{ready?'基于当前数据生成':'上传后在这里看到结果'}</small></div><div className="report-shell">{loading?<div className="loading"><b>正在整理你的流水…</b>按日期、品项和成本口径生成复盘草稿</div>:!ready?<div className="empty"><div className="empty-mark"><Icon name="report" size={26}/></div><h3>先上传一份账本</h3><p>你会看到营业额、成本、毛利、客单价、品项贡献和利润下滑原因。没有文件也可以点击左侧示例账本。</p></div>:!reportConfirmed?<div className="report-confirm"><h3>生成专业复盘报告前，先确认数据口径</h3><p>这一步不是重复填数字，而是确认报告范围和统计规则。口径不清，结论就不能拿来做经营决策。</p><div className="confirm-grid"><div className="confirm-field"><label>分析周期</label><select value={period} onChange={e=>setPeriod(e.target.value)}><option>本月（自然月）</option><option>最近 30 天</option><option>自定义周期</option></select></div><div className="confirm-field"><label>门店 / 经营单元</label><select value={store} onChange={e=>setStore(e.target.value)}><option>早餐店主店</option><option>早餐店外摆档</option><option>全部门店合并</option></select></div><div className="confirm-field"><label>订单口径</label><select value={orderBasis} onChange={e=>setOrderBasis(e.target.value)}><option>按支付订单数</option><option>按流水行数（仅当每行一单）</option><option>暂不计算客单价</option></select></div><div className="confirm-field"><label>成本口径</label><select value={costBasis} onChange={e=>setCostBasis(e.target.value)}><option>进货 + 包材 + 平台费</option><option>仅计原料成本</option><option>含房租水电等固定成本</option></select></div></div><div className="confirm-checks"><label><input type="checkbox" checked={includeAnomaly} onChange={e=>setIncludeAnomaly(e.target.checked)}/>异常订单单独标记，不直接混入趋势</label><label><input type="checkbox" checked={reportAck} onChange={e=>setReportAck(e.target.checked)}/>我确认这份数据可以代表本次经营分析</label></div><button className="primary" disabled={!reportAck} onClick={confirmReport}>确认口径并生成专业报告<Icon name="arrowRight" size={15}/></button></div>:<><div className="report-tabs">{[['overview','本月总览'],['items','品项贡献'],['diagnosis','利润诊断']].map(x=><button key={x[0]} className={tab===x[0]?'active':''} onClick={()=>setTab(x[0])}>{x[1]}</button>)}</div><div className="report">{tab==='overview'&&<><div className="report-top"><div><h2>9 月经营复盘</h2><p>已合并 {rows.length} 个品项 · 共 {money(data.qty)} 份成交 · {period} · {store}</p></div><span className="period">数据来源：{files.length?'上传账本':'手工补录'}</span></div><div className="report-quality"><div><small>报告口径</small><b>{orderBasis} · {costBasis}</b></div><div><small>数据覆盖</small><b>30 天 / {rows.length} 个品项 / {money(data.orders)} 个订单</b></div><div><small>质量提醒</small><b>{includeAnomaly?'异常订单已单独标记':'异常订单已纳入趋势'}</b></div><div><small>结论置信度</small><b>中 · 需要补充采购明细</b></div></div><div className="metrics"><div className="metric"><small>营业额</small><strong>¥{money(data.revenue)}</strong><em>+8.4%</em></div><div className="metric"><small>总成本</small><strong>¥{money(data.cost)}</strong><em style={{color:'var(--red)'}}>+12.7%</em></div><div className="metric"><small>毛利</small><strong>¥{money(data.gross)}</strong><em style={{color:'var(--red)'}}>−3.1%</em></div><div className="metric"><small>平均客单价</small><strong>¥{data.avg.toFixed(1)}</strong><em>按订单数</em></div></div><div className="trend"><b>先看结论：收入在涨，但成本涨得更快</b><span>本月毛利率 {data.margin.toFixed(1)}%；当前记录里 {topLoss.name} 的损耗率最高（{Number(topLoss.waste||0).toFixed(1)}%），建议先处理它。</span></div><div className="chart">{[58,64,52,72,68,81,76].map((x,i)=><div className="barcol" key={i}><i style={{height:x+'%'}}></i><small>{i+1}周</small></div>)}</div><div className="report-foot"><span>建议先处理毛利下滑，再追求更多流水</span><b>诊断置信度：中</b></div></>}{tab==='items'&&<><div className="report-top"><div><h2>品项贡献</h2><p>不要只看总营业额，先看哪个品项真正留下钱。</p></div><span className="period">按毛利排序</span></div><div className="table-wrap"><table><thead><tr><th>品项</th><th>订单数</th><th>销量</th><th>营业额</th><th>成本</th><th>毛利率</th><th>损耗</th><th>状态</th></tr></thead><tbody>{rows.map((r,i)=><tr key={i}><td><strong>{r.name}</strong></td><td>{money(r.orders||Math.max(1,Math.round(r.qty/2)))}</td><td>{money(r.qty)}</td><td>¥{money(r.revenue)}</td><td>¥{money(r.cost)}</td><td>{((r.revenue-r.cost)/r.revenue*100).toFixed(1)}%</td><td>{r.waste.toFixed(1)}%</td><td><span className={'badge '+(r.tag==='稳定'?'good':r.tag==='高损耗'?'bad':'warn')}>{r.tag}</span></td></tr>)}</tbody></table></div><div className="report-foot"><span>共 {rows.length} 个品项 · 可继续手工补录新品</span><b>先处理红色状态品项</b></div></>}{tab==='diagnosis'&&<><div className="report-top"><div><h2>利润为什么下滑</h2><p>把“感觉不赚钱”拆成可以行动的几个原因。</p></div><span className="period">自动诊断</span></div><div className="diagnosis"><div className="diagnosis-box"><h3>主要影响因素</h3><div className="reason-list"><div className="reason-row"><b>原料成本上涨 / 占比变高</b><span>+¥1,240</span><i style={{'--w':'78%'}}></i></div><div className="reason-row"><b>油条损耗高于门店平均</b><span>+¥410</span><i style={{'--w':'47%'}}></i></div><div className="reason-row"><b>高毛利品项销量下降</b><span>+¥280</span><i style={{'--w':'32%'}}></i></div><div className="reason-row"><b>客单价没有跟上成本</b><span>+¥190</span><i style={{'--w':'24%'}}></i></div></div></div><div className="diagnosis-box"><h3>明天可以执行的 3 个动作</h3><div className="action-list"><div className="action"><span className="action-num">1</span><div><b>油条只炸两轮，11:00 后按需补</b><span>先把损耗从 8.8% 压到 5% 以下</span></div></div><div className="action"><span className="action-num">2</span><div><b>豆浆与包子做一个 12 元组合</b><span>让高毛利品项带动客单价</span></div></div><div className="action"><span className="action-num">3</span><div><b>明天收摊前记一次“剩下多少”</b><span>补齐损耗原因，下一次诊断会更准</span></div></div></div></div></div><div className="report-foot"><span>报告不是财务审计，结论基于你提供的记录</span><b>下一步：先做第 1 个动作</b></div></>}</div></>}{ready&&<div className="report-foot" style={{padding:'11px 18px',margin:0,background:'#f7f6ee'}}><span>需要更细的月份对比、采购明细或门店对照？</span><button className="primary" onClick={()=>notify('专业版报告需求已记录')}>申请专业版报告<Icon name="arrowRight" size={15}/></button></div>}</div></section></main>{toast&&<div className="toast">{toast}</div>}</div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
